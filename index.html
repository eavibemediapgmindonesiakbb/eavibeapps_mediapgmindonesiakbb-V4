<!DOCTYPE html>
<html>
<head>
  <title>Tes Login Apps Script</title>
</head>
<body>
  <h2>Tes Koneksi ke Apps Script</h2>
  <button onclick="tesLogin()">Klik Buat Tes Login</button>
  <h3>Hasil:</h3>
  <pre id="hasil">Belum di tes...</pre>

  <script>
    function tesLogin() {
      document.getElementById('hasil').textContent = 'Lagi loading...';
      
      fetch('https://script.google.com/macros/s/AKfycbyJDyDWkjYwvSd7PgTwqdIrhC5J1zYa-2pv0ivCFxATXgVQWyE2C4Zk33ZMt-o0jrxrTg/exec', {
        method: 'POST',
        redirect: 'follow',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({nik: '3217090802760018'})
      })
      .then(r => r.text())
      .then(data => {
        document.getElementById('hasil').textContent = data;
      })
      .catch(err => {
        document.getElementById('hasil').textContent = 'ERROR: ' + err;
      });
    }
  </script>
</body>
</html>
